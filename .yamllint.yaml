extends: default

ignore: |
  kubernetes/clusters/*/flux-system/
  *.sops.yaml
  ansible/collections/

rules:
  document-start: disable
  line-length: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  indentation:
    spaces: 2
    indent-sequences: consistent
  # Settings below keep yamllint compatible with ansible-lint.
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
