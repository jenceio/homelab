# SOPS encryption rules. Only files named *.sops.yaml are ever meant to hold secrets.
#
# Replace the placeholder with YOUR age public key:
#   age-keygen -y ~/.config/sops/age/keys.txt
# Strongly recommended: add a second recipient whose private key is kept offline
# (password manager / paper) so losing one machine never locks you out.
keys:
  - &admin age10hr6pj0l5vtgwx03zw4y2sh2qqg89vk7rtq3zxg9spmyern4k55qg5hcx8

creation_rules:
  # Kubernetes Secrets: encrypt only data/stringData so Flux/kustomize can still read metadata.
  - path_regex: ^kubernetes/.*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin

  # OpenTofu / Ansible: encrypt every value (keys stay readable).
  - path_regex: ^(tofu|ansible)/.*\.sops\.ya?ml$
    key_groups:
      - age:
          - *admin
