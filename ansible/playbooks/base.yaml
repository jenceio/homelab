- name: Prepare cluster nodes
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Upgrade packages and install base tooling
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
          - curl
          - nfs-common
          - open-iscsi
        state: present
        update_cache: true
        upgrade: safe
        cache_valid_time: 3600

    - name: Enable qemu-guest-agent
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started
        enabled: true
