# Keep in sync with `nodes` in tofu/homelab.auto.tfvars (`tofu output nodes`).
# Group names `server` / `agent` are what k3s.orchestration expects.
k3s_cluster:
  children:
    server:
      hosts:
        k3s-server-1:
          ansible_host: 192.168.1.51
    agent:
      hosts:
        k3s-agent-1:
          ansible_host: 192.168.1.61
        k3s-agent-2:
          ansible_host: 192.168.1.62
